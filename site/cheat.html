<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="GoLens 全站速查总览" />
  <title>速查总览 · GoLens</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/lab-motion.css" />
  <link rel="stylesheet" href="assets/css/guide.css" />
</head>
<body data-page="cheat">
  <div class="scrim" aria-hidden="true"></div>
  <div class="shell">
    <aside class="sidebar" aria-label="站点导航">
      <a class="brand" href="index.html"><span class="brand-mark">GoLens</span><span class="brand-sub">Runtime Lab</span></a>
      <nav class="nav-section" aria-label="章节目录"><div class="nav-label">目录</div></nav>
      <div class="sidebar-foot">考前 5 分钟只看这一页</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost menu-btn" type="button" aria-expanded="false" aria-label="打开目录">菜单</button>
        <div class="topbar-title">GoLens / 19 cheat</div>
        <div class="topbar-actions"><span class="chip">章节 19</span></div>
      </header>
      <article class="content lab-wide">
        <div class="eyebrow">Chapter 19</div>
        <h1>速查总览</h1>
        <p class="verdict">
          把各章速查收成一页：按<strong>语言 / 并发 / 内存 / 工程</strong>筛选，看到关键词能否 30 秒口述机制。
        </p>
        <h2>Lab · 口袋卡片</h2>
        <div class="lab" id="cheat-lab">
          <div class="lab-head">
            <div class="lab-title"><span class="led" aria-hidden="true"></span>Cheat Sheet</div>
            <span class="chip">filter</span>
          </div>
          <div class="lab-controls">
            <div class="btn-row">
              <label>分组
                <select id="cheat-filter">
                  <option value="all">全部</option>
                  <option value="语言">语言</option>
                  <option value="并发">并发</option>
                  <option value="内存">内存</option>
                  <option value="工程">工程</option>
                </select>
              </label>
            </div>
          </div>
          <div class="story-band" id="cheat-story">
            <div class="code-track">
              <div class="code-title">筛选轴</div>
              <pre>
<span class="code-line" data-code-key="all">全部速查</span>
<span class="code-line" data-code-key="语言">string / slice / error / defer</span>
<span class="code-line" data-code-key="并发">GMP / channel / lock / ctx</span>
<span class="code-line" data-code-key="内存">escape / GC</span>
              </pre>
            </div>
            <div class="story-card">
              <div class="story-step" data-story-step>关卡 1 / 4</div>
              <h3 class="story-title" data-story-title></h3>
              <div class="story-metaphor" data-story-metaphor></div>
              <p class="story-body" data-story-body></p>
              <div class="story-actions">
                <button type="button" class="btn" data-story-prev>上一关</button>
                <button type="button" class="btn btn-primary" data-story-next>下一关</button>
                <div class="story-dots" data-story-dots></div>
              </div>
            </div>
          </div>
          <div class="lab-grid-3">
            <div class="lab-stage" id="cheat-stage" aria-live="polite"></div>
            <div class="lab-log" id="cheat-log" aria-live="polite"></div>
          </div>
        </div>
        <nav class="page-nav">
          <a href="drill.html">← 综合演练</a>
          <a href="index.html">回首页 →</a>
        </nav>
      </article>
    </div>
  </div>
  <script src="assets/js/chapters.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/guide.js"></script>
  <script src="assets/js/cheat-lab.js"></script>
</body>
</html>
