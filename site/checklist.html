<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Go 工程清单：质量、测试、发布、Review" />
  <title>工程清单 · GoLens</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/lab-motion.css" />
  <link rel="stylesheet" href="assets/css/guide.css" />
</head>
<body data-page="checklist">
  <div class="scrim" aria-hidden="true"></div>
  <div class="shell">
    <aside class="sidebar" aria-label="站点导航">
      <a class="brand" href="index.html"><span class="brand-mark">GoLens</span><span class="brand-sub">Runtime Lab</span></a>
      <nav class="nav-section" aria-label="章节目录"><div class="nav-label">目录</div></nav>
      <div class="sidebar-foot">习惯与检查单</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost menu-btn" type="button" aria-expanded="false" aria-label="打开目录">菜单</button>
        <div class="topbar-title">GoLens / 19 checklist</div>
        <div class="topbar-actions"><span class="chip">章节 19</span></div>
      </header>
      <article class="content lab-wide">
        <div class="eyebrow">Chapter 19</div>
        <h1>工程清单</h1>
        <p class="verdict">
          上线与面试都爱问「你怎么保证质量」。用清单把 <strong>代码 / 测试 / 发布 / Review</strong> 四段习惯说清楚。
        </p>
        <h2>Lab</h2>
        <div class="lab" id="chk-lab">
          <div class="lab-head">
            <div class="lab-title"><span class="led" aria-hidden="true"></span>Checklist Lab</div>
            <span class="chip">可勾选</span>
          </div>
          <div class="lab-controls">
            <div class="btn-row">
              <label>阶段
                <select id="chk-phase">
                  <option value="code">代码质量</option>
                  <option value="test">测试与基准</option>
                  <option value="ship">发布前</option>
                  <option value="review">Code Review</option>
                </select>
              </label>
              <button type="button" class="btn btn-ghost" id="chk-reset">重置勾选</button>
            </div>
          </div>
          <div class="story-band" id="chk-story">
            <div class="code-track">
              <div class="code-title">清单轴</div>
              <pre>
<span class="code-line" data-code-key="code">gofmt / vet / error / lock</span>
<span class="code-line" data-code-key="test">go test ./... · race · bench</span>
<span class="code-line" data-code-key="ship">tidy · README · secrets</span>
<span class="code-line" data-code-key="review">校验 · 日志 · 依赖 · 所有权</span>
              </pre>
            </div>
            <div class="story-card">
              <div class="story-step" data-story-step>关卡 1 / 4</div>
              <h3 class="story-title" data-story-title></h3>
              <div class="story-metaphor" data-story-metaphor></div>
              <p class="story-body" data-story-body></p>
              <div class="story-actions">
                <button type="button" class="btn" data-story-prev>上一关</button>
                <button type="button" class="btn btn-primary" data-story-next>下一关</button>
                <div class="story-dots" data-story-dots></div>
              </div>
            </div>
          </div>
          <div class="lab-grid-3">
            <div class="lab-stage" id="chk-stage" aria-live="polite"></div>
            <div class="lab-log" id="chk-log" aria-live="polite"></div>
          </div>
        </div>
        <nav class="page-nav">
          <a href="perf.html">← 性能排查直觉</a>
          <a href="drill.html">下一章 综合演练 →</a>
        </nav>
      </article>
    </div>
  </div>
  <script src="assets/js/chapters.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/guide.js"></script>
  <script src="assets/js/checklist-lab.js"></script>
</body>
</html>
