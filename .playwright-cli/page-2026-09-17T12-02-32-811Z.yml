    - article [ref=e23]:
      - generic [ref=e24]: Chapter 01
      - heading "GMP 调度" [level=1] [ref=e25]
      - paragraph [ref=e26]:
        - text: INTERVIEW Go 用
        - strong [ref=e27]: G
        - text: （goroutine）承载任务、
        - strong [ref=e28]: P
        - text: （逻辑处理器）持有可运行队列、
        - strong [ref=e29]: M
        - text: （OS 线程）真正执行；调度的本质是让 M 尽快从某个 P 的队列里拿到 G。
      - heading "为什么需要 GMP" [level=2] [ref=e30]
      - paragraph [ref=e31]:
        - text: 若每个 goroutine 都绑死一条 OS 线程，海量协程会把线程栈和切换成本打爆。 Go 把「可运行的 G」和「执行用的 M」解耦，中间用数量有限的 P 做缓冲与本地化：
        - code [ref=e32]: GOMAXPROCS
        - text: 决定 P 的个数，也就是同时能有多少 M「持有调度上下文」。
      - heading "三个角色" [level=2] [ref=e33]
      - table [ref=e35]:
        - rowgroup [ref=e36]:
          - row [ref=e37]:
            - columnheader "角色" [ref=e38]
            - columnheader "是什么" [ref=e39]
            - columnheader "面试关键句" [ref=e40]
        - rowgroup [ref=e41]:
          - row [ref=e42]:
            - cell [ref=e43]:
              - code [ref=e44]: G
            - cell "Goroutine，含栈、指令指针、状态" [ref=e45]
            - cell "用户态轻量执行体；栈可从 2KB 增长" [ref=e46]
          - row [ref=e47]:
            - cell [ref=e48]:
              - code [ref=e49]: P
            - cell "Processor，逻辑处理器，持有本地运行队列等资源" [ref=e50]
            - cell "P 数量 = GOMAXPROCS；没有 P 就不能调度用户 G" [ref=e51]
          - row [ref=e52]:
            - cell [ref=e53]:
              - code [ref=e54]: M
            - cell "Machine，OS 线程" [ref=e55]
            - cell "M 要绑定 P 才能跑 G；阻塞时可能与 P 解绑" [ref=e56]
      - heading "队列与偷取" [level=2] [ref=e57]
      - paragraph [ref=e58]:
        - text: 每个 P 有
        - strong [ref=e59]: runnext
        - text: （下一只优先跑的 G，通常 1 个坑位）和
        - strong [ref=e60]: 本地队列
        - text: （历史上常见上限 256）。 本地满了会推一半到
        - strong [ref=e61]: 全局队列
        - text: 。P 空了会先看全局队列，再随机偷其他 P 本地队列的一半——这就是 work stealing。
      - generic [ref=e62]:
        - generic [ref=e63]: 阻塞时发生什么
        - paragraph [ref=e64]: G 进入阻塞（如 channel、系统调用）后，M 可能带着 G 挂起；调度器会为 P 另找 M，保证吞吐不塌。系统调用场景下常见「M 与 G 绑住、P 被挪走」的叙述。
      - heading "交互 Lab · 调度器巡检" [level=2] [ref=e65]
      - paragraph [ref=e66]: 选场景后单步或播放，观察队列变化与事件日志。刻意简化了抢占信号与 spinning 状态计数。
