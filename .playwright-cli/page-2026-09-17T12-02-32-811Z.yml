      - heading "速查表" [level=2] [ref=e128]
      - list [ref=e130]:
        - listitem [ref=e131]: G = goroutine；P = 逻辑处理器（GOMAXPROCS）；M = OS 线程
        - listitem [ref=e132]: P 本地队列 + runnext；溢出推全局；空了找全局 / 偷其他 P
        - listitem [ref=e133]: M 必须持有 P 才能调度用户 G
        - listitem [ref=e134]: channel / syscall 阻塞可能导致 M–P 分离，调度器另起 M
        - listitem [ref=e135]: 目标：高吞吐、低延迟地把可运行 G 丢到核上
