      - heading "速查表" [level=2] [ref=e110]
      - list [ref=e112]:
        - listitem [ref=e113]: hchan：buf + sendx/recvx + sendq/recvq + closed
        - listitem [ref=e114]: 发送：先对接 recvq → 再入 buf → 否则挂 sendq
        - listitem [ref=e115]: 接收：先对接 sendq → 再取 buf → 否则挂 recvq
        - listitem [ref=e116]: close：唤醒 recvq；再 send panic；buf 仍可收完
        - listitem [ref=e117]: cap=0 为同步会合；nil channel 永久阻塞
