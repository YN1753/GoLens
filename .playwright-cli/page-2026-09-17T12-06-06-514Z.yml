    - article [ref=e23]:
      - generic [ref=e24]: Chapter 02
      - heading "Channel 底层" [level=1] [ref=e25]
      - paragraph [ref=e26]:
        - text: INTERVIEW Channel 不是「带锁的队列」这么简单：它在
        - code [ref=e27]: hchan
        - text: 上同时维护环形缓冲与收发等待队列， 能直接交接就不入队，队列空了才阻塞并把 G 挂到
        - code [ref=e28]: recvq
        - text: /
        - code [ref=e29]: sendq
        - text: 。
      - heading "hchan 里有什么" [level=2] [ref=e30]
      - paragraph [ref=e31]: 面试可记这几样（名称按源码习惯）：
      - list [ref=e32]:
        - listitem [ref=e33]:
          - code [ref=e34]: buf
          - text: ：环形缓冲；无缓冲 channel 的
          - code [ref=e35]: cap = 0
          - text: ，buf 退化为直接交接
        - listitem [ref=e36]:
          - code [ref=e37]: sendx
          - text: /
          - code [ref=e38]: recvx
          - text: ：下一次收发下标；
          - code [ref=e39]: count
          - text: 当前元素数
        - listitem [ref=e40]:
          - code [ref=e41]: sendq
          - text: /
          - code [ref=e42]: recvq
          - text: ：因发送/接收阻塞的 G（sudog 链表）
        - listitem [ref=e43]:
          - code [ref=e44]: closed
          - text: ：关闭标记；关闭后接收可读零值，发送会 panic
        - listitem [ref=e45]: 互斥锁：保护上述结构的一致性（细节可一句带过）
      - heading "发送路径（口述版）" [level=2] [ref=e46]
      - list [ref=e47]:
        - listitem [ref=e48]:
          - text: 若
          - code [ref=e49]: recvq
          - text: 有人等：直接把值交给等待的接收者，唤醒它（缓冲 channel 也可能先把等待者队列里的值挪出来再入队，概念上记「优先对接等待者」）。
        - listitem [ref=e50]:
          - text: 否则若缓冲未满：写入
          - code [ref=e51]: buf
          - text: ，成功返回。
        - listitem [ref=e52]:
          - text: 否则：当前 G 挂入
          - code [ref=e53]: sendq
          - text: 阻塞，等接收方取走后再被唤醒。
      - paragraph [ref=e54]:
        - text: 接收路径对称：先对接
        - code [ref=e55]: sendq
        - text: 等待者，否则从 buf 取，否则挂
        - code [ref=e56]: recvq
        - text: 。
      - generic [ref=e57]:
        - generic [ref=e58]: close 要点
        - paragraph [ref=e59]:
          - text: 关闭会唤醒所有等待接收者（读到零值与
          - code [ref=e60]: ok=false
          - text: ）；对已关闭 channel 发送 panic；重复 close 也 panic。向带缓冲 channel 关闭后，缓冲里已有元素仍可被取完。
